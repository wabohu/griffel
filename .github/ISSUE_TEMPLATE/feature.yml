name: Feature request
description: An idea for griffel
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What do you want to do?
      description: The task, not the solution. What are you trying to show or get done?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: With griffel or another tool, and what gets in the way.
