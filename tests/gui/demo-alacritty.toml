# Alacritty config for tests/gui/demo.py: colors Tokyo Night Storm (as the developer's own
# setup). griffel takes its palette and bar colors from here too ([colors] source = "auto").

[font]
size = 24

[font.normal]
family = "RobotoMono Nerd Font Mono"

[window.padding]
x = 40
y = 30

[colors.primary]
background = "#24283b"
foreground = "#c0caf5"

[colors.normal]
black = "#1d202f"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"
