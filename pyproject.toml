[build-system]
requires = ["setuptools>=77"]  # SPDX string in license, license-files
build-backend = "setuptools.build_meta"

[project]
name = "griffel"
dynamic = ["version"]
description = "Screenshot annotation tool and whiteboard for X11"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"  # tomllib
dependencies = ["PySide6>=6.5"]  # for pip/pipx; on Arch it comes from pacman (pyside6)
keywords = ["screenshot", "annotation", "whiteboard", "x11", "pyside6"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.scripts]
griffel = "griffel.app:main"

[project.urls]
Homepage = "https://github.com/wabohu/griffel"
Issues = "https://github.com/wabohu/griffel/issues"

[tool.setuptools.dynamic]
version = { attr = "griffel.__version__" }

[tool.setuptools.package-data]
griffel = ["data/*.rasi"]
